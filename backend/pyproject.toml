[project]
name = "sudhaar-backend"
version = "0.1.0"
description = "Sudhaar: Consent-first AI agent for Paytm loan journeys"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "google-genai>=0.1.1",
    "pytest>=8.0.0",
    "httpx>=0.27.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
